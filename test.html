<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Assistant Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        button {
            padding: 15px 30px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        #recordBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        #recordBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        #recordBtn.recording {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .status {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            background: #f8f9fa;
            color: #666;
            font-size: 14px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .status.processing {
            background: #fff3cd;
            color: #856404;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        audio {
            width: 100%;
            margin-top: 15px;
            border-radius: 10px;
        }
        
        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        
        .indicator.recording {
            background: #f5576c;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .api-config {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }
        
        .api-config label {
            display: block;
            color: #666;
            font-size: 12px;
            margin-bottom: 5px;
        }
        
        .api-config input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 Voice Assistant</h1>
        <p class="subtitle">Record your voice, get an AI response</p>
        
        <div class="controls">
            <button id="recordBtn">
                <span id="recordIcon">🎤</span>
                <span id="recordText">Start Recording</span>
            </button>
            
            <div id="status" class="status">
                Ready to record
            </div>
            
            <audio id="responseAudio" controls style="display: none;"></audio>
        </div>
        
        <div class="api-config">
            <label for="apiUrl">API Endpoint:</label>
            <input type="text" id="apiUrl" value="http://localhost:3000/converse" placeholder="http://localhost:3000/converse">
        </div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        const recordBtn = document.getElementById('recordBtn');
        const recordText = document.getElementById('recordText');
        const recordIcon = document.getElementById('recordIcon');
        const status = document.getElementById('status');
        const responseAudio = document.getElementById('responseAudio');
        const apiUrlInput = document.getElementById('apiUrl');

        recordBtn.addEventListener('click', async () => {
            if (!isRecording) {
                await startRecording();
            } else {
                await stopRecording();
            }
        });

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    await sendToAPI(audioBlob);
                };

                mediaRecorder.start();
                isRecording = true;
                
                recordBtn.classList.add('recording');
                recordText.textContent = 'Stop Recording';
                recordIcon.innerHTML = '<span class="indicator recording"></span>';
                setStatus('🎤 Recording... (click to stop)', 'processing');
                
            } catch (error) {
                console.error('Error accessing microphone:', error);
                setStatus('❌ Microphone access denied', 'error');
            }
        }

        async function stopRecording() {
            mediaRecorder.stop();
            mediaRecorder.stream.getTracks().forEach(track => track.stop());
            isRecording = false;
            
            recordBtn.classList.remove('recording');
            recordBtn.disabled = true;
            recordText.textContent = 'Processing...';
            recordIcon.textContent = '⏳';
        }

        async function sendToAPI(audioBlob) {
            try {
                setStatus('📤 Sending to API...', 'processing');
                
                const formData = new FormData();
                formData.append('audio', audioBlob, 'recording.wav');

                const apiUrl = apiUrlInput.value;
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || `HTTP ${response.status}`);
                }

                setStatus('🔊 Received response!', 'success');
                
                const audioResponseBlob = await response.blob();
                const audioUrl = URL.createObjectURL(audioResponseBlob);
                
                responseAudio.src = audioUrl;
                responseAudio.style.display = 'block';
                responseAudio.play();
                
            } catch (error) {
                console.error('Error:', error);
                setStatus(`❌ Error: ${error.message}`, 'error');
            } finally {
                recordBtn.disabled = false;
                recordText.textContent = 'Start Recording';
                recordIcon.textContent = '🎤';
            }
        }

        function setStatus(message, type = '') {
            status.textContent = message;
            status.className = 'status' + (type ? ' ' + type : '');
        }
    </script>
</body>
</html>
