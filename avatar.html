<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bunny Buddy - Voice Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at 50% 30%, #e0f2fe 0%, #f8fafc 55%, #ffffff 100%);
      min-height: 100vh;
    }
    
    .sound-bar {
      transition: height 0.08s ease-out, transform 0.08s ease-out;
      will-change: height, transform;
    }

    /* Subtle pulse animation for thinking state */
    @keyframes barPulse {
      0%, 100% { transform: scaleY(0.4); }
      50% { transform: scaleY(1.3); }
    }

    .thinking-pulse .sound-bar:nth-child(1) { animation: barPulse 1.2s infinite ease-in-out 0.0s; }
    .thinking-pulse .sound-bar:nth-child(2) { animation: barPulse 1.2s infinite ease-in-out 0.2s; }
    .thinking-pulse .sound-bar:nth-child(3) { animation: barPulse 1.2s infinite ease-in-out 0.4s; }
    .thinking-pulse .sound-bar:nth-child(4) { animation: barPulse 1.2s infinite ease-in-out 0.6s; }
    .thinking-pulse .sound-bar:nth-child(5) { animation: barPulse 1.2s infinite ease-in-out 0.8s; }

    /* Custom Glassmorphism */
    .glass-pill {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="relative flex flex-col justify-between min-h-screen text-slate-800 antialiased selection:bg-sky-200 overflow-x-hidden">

  <!-- Transparent Landscape Background Image -->
  <div class="fixed inset-0 pointer-events-none z-0 bg-cover bg-center bg-no-repeat opacity-30" style="background-image: url('background_landscape.jpg');"></div>

  <!-- Top Minimal Header Navbar -->
  <header class="w-full max-w-6xl mx-auto px-6 py-6 flex items-center justify-between z-20">
    <a href="#" class="text-sm font-semibold text-slate-600 hover:text-slate-900 transition-colors">← Homepage</a>
    <a href="#" class="text-sm font-semibold text-slate-600 hover:text-slate-900 transition-colors">For agents?</a>
  </header>

  <!-- Main Container -->
  <main class="flex-1 flex flex-col items-center justify-center px-4 -mt-6 relative z-10 text-center">
    
    <!-- LANDING / IDLE VIEW -->
    <div id="idleView" class="flex flex-col items-center max-w-2xl mx-auto transition-all duration-300 opacity-100 scale-100">
      
      <!-- Hero Title & Subtitle -->
      <h1 class="text-4xl sm:text-5xl md:text-6xl font-bold tracking-tight text-slate-900 mb-3">
        Hi. I'm Bunny Buddy.
      </h1>
      <p class="text-lg sm:text-xl text-slate-600 font-normal mb-1">
        Pick up where we left off, or start somewhere new.
      </p>
      <span class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-10">
        Hold Space to talk
      </span>

      <!-- Quick Prompt Pills -->
      <div class="flex flex-wrap items-center justify-center gap-3 max-w-xl mx-auto mb-12">
        <button data-prompt="How's your week going?" class="prompt-btn px-5 py-2.5 rounded-full glass-pill border border-slate-200/90 shadow-sm hover:shadow-md hover:border-slate-300 text-sm font-medium text-slate-700 hover:text-slate-900 transition-all duration-200 transform hover:-translate-y-0.5 active:translate-y-0">
          How's your week going?
        </button>
        <button data-prompt="Working on anything fun?" class="prompt-btn px-5 py-2.5 rounded-full glass-pill border border-slate-200/90 shadow-sm hover:shadow-md hover:border-slate-300 text-sm font-medium text-slate-700 hover:text-slate-900 transition-all duration-200 transform hover:-translate-y-0.5 active:translate-y-0">
          Working on anything fun?
        </button>
        <button data-prompt="I'm hiring. What should I ask?" class="prompt-btn px-5 py-2.5 rounded-full glass-pill border border-slate-200/90 shadow-sm hover:shadow-md hover:border-slate-300 text-sm font-medium text-slate-700 hover:text-slate-900 transition-all duration-200 transform hover:-translate-y-0.5 active:translate-y-0">
          I'm hiring. What should I ask?
        </button>
        <button id="askAnythingPill" class="prompt-btn px-5 py-2.5 rounded-full glass-pill border border-slate-200/90 shadow-sm hover:shadow-md hover:border-slate-300 text-sm font-medium text-slate-700 hover:text-slate-900 transition-all duration-200 transform hover:-translate-y-0.5 active:translate-y-0">
          Ask me anything
        </button>
      </div>

      <!-- Central Floating Microphone Action Button -->
      <button id="micBtn" title="Click to start/stop talking" class="relative group p-5 rounded-full bg-slate-900 text-white shadow-xl hover:shadow-2xl hover:scale-105 active:scale-95 transition-all duration-300 focus:outline-none focus:ring-4 focus:ring-sky-300">
        <span class="absolute -inset-1 rounded-full bg-sky-400 opacity-0 group-hover:opacity-25 blur transition-opacity"></span>
        <svg class="w-7 h-7 relative z-10 fill-current" viewBox="0 0 24 24">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </button>

    </div>

    <!-- ACTIVE VOICE LISTENING / SPEAKING VIEW -->
    <div id="activeView" class="hidden flex-col items-center max-w-md mx-auto transition-all duration-300 opacity-0 scale-95">
      
      <!-- Central Black Circular Capsule Visualizer -->
      <button id="visualizerCapsule" title="Click to end session" class="relative group px-10 py-7 bg-slate-950 hover:bg-slate-900 text-white rounded-full shadow-2xl transition-all duration-300 transform hover:scale-105 active:scale-95 focus:outline-none ring-4 ring-slate-900/10">
        <div id="soundBarsContainer" class="flex items-center justify-center space-x-1.5 h-10 w-24">
          <div class="sound-bar w-1.5 bg-white rounded-full h-4"></div>
          <div class="sound-bar w-1.5 bg-white rounded-full h-8"></div>
          <div class="sound-bar w-1.5 bg-white rounded-full h-6"></div>
          <div class="sound-bar w-1.5 bg-white rounded-full h-9"></div>
          <div class="sound-bar w-1.5 bg-white rounded-full h-5"></div>
        </div>
      </button>

      <!-- Status Text & Badge -->
      <div class="mt-6 flex flex-col items-center gap-2">
        <span id="activeStatusText" class="text-base font-semibold text-slate-800 tracking-tight">
          Listening...
        </span>
        <span class="px-3.5 py-1 text-xs font-medium text-slate-500 bg-slate-200/60 backdrop-blur-sm rounded-full">
          Works best on Chrome.
        </span>
      </div>

    </div>

  </main>

  <!-- Keyboard Hints Footer Banner -->
  <footer class="w-full max-w-sm mx-auto mb-8 px-4 z-20">
    <div class="flex items-center justify-center gap-2 px-4 py-2.5 rounded-full glass-pill border border-slate-200/80 shadow-sm text-xs font-medium text-slate-500">
      <button id="cmdKTrigger" class="hover:text-slate-900 transition-colors flex items-center gap-1">
        <kbd class="px-1.5 py-0.5 text-[10px] font-semibold text-slate-700 bg-slate-100 border border-slate-200 rounded">⌘K</kbd> to type
      </button>
      <span class="text-slate-300">•</span>
      <span class="flex items-center gap-1">
        <kbd class="px-1.5 py-0.5 text-[10px] font-semibold text-slate-700 bg-slate-100 border border-slate-200 rounded">Space</kbd> hold to talk
      </span>
    </div>
  </footer>

  <!-- Command Palette Text Modal (⌘K) -->
  <div id="cmdKModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div id="modalContent" class="w-full max-w-lg bg-white rounded-2xl shadow-2xl border border-slate-200 p-5 transform transition-all duration-200 scale-95 opacity-0">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Ask Bunny Buddy</span>
        <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600 text-xs font-semibold px-2 py-1 rounded bg-slate-100 hover:bg-slate-200 transition-colors">ESC</button>
      </div>
      <form id="textForm" class="mt-4 flex items-center gap-2">
        <input id="textInput" type="text" placeholder="Type a message or question..." class="flex-1 px-4 py-3 text-sm text-slate-800 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white transition-all">
        <button type="submit" class="px-5 py-3 text-sm font-semibold text-white bg-slate-900 hover:bg-slate-800 rounded-xl transition-all shadow-sm">
          Send
        </button>
      </form>
    </div>
  </div>

  <!-- Client Script Wiring -->
  <script>
    // State Variables
    let isRecording = false;
    let isSpaceHeld = false;
    let mediaRecorder = null;
    let audioChunks = [];
    let audioCtx = null;
    let analyser = null;
    let animFrameId = null;
    let currentSourceNode = null;
    
    // Session ID setup
    let sessionId = localStorage.getItem('bunny_session_id');
    if (!sessionId) {
      sessionId = 'session_' + Math.random().toString(36).substring(2, 11);
      localStorage.setItem('bunny_session_id', sessionId);
    }

    // DOM Elements
    const idleView = document.getElementById('idleView');
    const activeView = document.getElementById('activeView');
    const activeStatusText = document.getElementById('activeStatusText');
    const micBtn = document.getElementById('micBtn');
    const visualizerCapsule = document.getElementById('visualizerCapsule');
    const soundBarsContainer = document.getElementById('soundBarsContainer');
    const soundBars = document.querySelectorAll('.sound-bar');
    const cmdKModal = document.getElementById('cmdKModal');
    const modalContent = document.getElementById('modalContent');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const cmdKTrigger = document.getElementById('cmdKTrigger');
    const textForm = document.getElementById('textForm');
    const textInput = document.getElementById('textInput');
    const askAnythingPill = document.getElementById('askAnythingPill');

    // Initialize Web Audio Context
    function initAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // View Transitions
    function showActiveView(status = 'Listening...') {
      activeStatusText.textContent = status;
      idleView.classList.add('hidden');
      activeView.classList.remove('hidden');
      setTimeout(() => {
        activeView.classList.remove('opacity-0', 'scale-95');
        activeView.classList.add('opacity-100', 'scale-100');
      }, 20);
    }

    function showIdleView() {
      stopVisualizer();
      if (currentSourceNode) {
        try { currentSourceNode.stop(); } catch(e) {}
        currentSourceNode = null;
      }
      activeView.classList.add('opacity-0', 'scale-95');
      activeView.classList.remove('opacity-100', 'scale-100');
      setTimeout(() => {
        activeView.classList.add('hidden');
        idleView.classList.remove('hidden');
      }, 200);
    }

    // Soundwave Equalizer Visualization Loop
    function startVisualizer() {
      stopVisualizer();
      soundBarsContainer.classList.remove('thinking-pulse');
      const dataArray = new Uint8Array(analyser.frequencyBinCount);

      function draw() {
        analyser.getByteFrequencyData(dataArray);
        
        // Sample frequencies across bins for the 5 bars
        const indices = [2, 5, 8, 12, 16];
        soundBars.forEach((bar, i) => {
          const val = dataArray[indices[i]] || 0;
          const scale = Math.max(0.2, val / 140);
          const heightPx = Math.max(8, Math.min(36, val / 5));
          bar.style.transform = `scaleY(${scale.toFixed(2)})`;
          bar.style.height = `${heightPx}px`;
        });
        
        animFrameId = requestAnimationFrame(draw);
      }
      draw();
    }

    function startThinkingAnimation() {
      stopVisualizer();
      soundBarsContainer.classList.add('thinking-pulse');
      soundBars.forEach(bar => {
        bar.style.transform = '';
        bar.style.height = '16px';
      });
    }

    function stopVisualizer() {
      if (animFrameId) {
        cancelAnimationFrame(animFrameId);
        animFrameId = null;
      }
      soundBarsContainer.classList.remove('thinking-pulse');
      soundBars.forEach((bar, i) => {
        bar.style.transform = 'scaleY(1)';
        const defaultHeights = [16, 32, 24, 36, 20];
        bar.style.height = `${defaultHeights[i]}px`;
      });
    }

    // Audio Recording Logic
    async function startRecording() {
      if (isRecording) return;
      try {
        initAudioContext();
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        // Connect mic to analyser for live visualization during recording
        const source = audioCtx.createMediaStreamSource(stream);
        source.connect(analyser);

        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) {
            audioChunks.push(event.data);
          }
        };

        mediaRecorder.onstop = async () => {
          // Stop mic tracks
          stream.getTracks().forEach(track => track.stop());
          
          if (audioChunks.length > 0) {
            const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/wav' });
            await sendAudioQuery(audioBlob);
          }
        };

        mediaRecorder.start();
        isRecording = true;
        showActiveView('Listening...');
        startVisualizer();
      } catch (err) {
        console.error('Error accessing microphone:', err);
        alert('Could not access microphone. Please grant permission in your browser.');
        showIdleView();
      }
    }

    function stopRecording() {
      if (isRecording && mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        isRecording = false;
        showActiveView('Thinking...');
        startThinkingAnimation();
      }
    }

    // API Interactions
    async function sendAudioQuery(audioBlob) {
      showActiveView('Thinking...');
      startThinkingAnimation();
      try {
        const formData = new FormData();
        formData.append('audio', audioBlob, 'speech.wav');
        formData.append('sessionId', sessionId);

        const response = await fetch('/converse', {
          method: 'POST',
          body: formData
        });

        const newSessionId = response.headers.get('X-Session-ID');
        if (newSessionId) {
          sessionId = newSessionId;
          localStorage.setItem('bunny_session_id', sessionId);
        }

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.error || 'Speech endpoint error');
        }

        const returnedAudioBuffer = await response.arrayBuffer();
        await playReturnedAudio(returnedAudioBuffer);
      } catch (err) {
        console.error('Error sending audio query:', err);
        showIdleView();
      }
    }

    async function sendTextQuery(text) {
      if (!text || !text.trim()) return;
      closeModal();
      showActiveView('Thinking...');
      startThinkingAnimation();

      try {
        const response = await fetch('/converse-text', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_input: text,
            sessionId: sessionId
          })
        });

        if (!response.ok) {
          throw new Error('Text endpoint error');
        }

        const data = await response.json();
        if (data.sessionId) {
          sessionId = data.sessionId;
          localStorage.setItem('bunny_session_id', sessionId);
        }

        if (data.audio_base64) {
          const binaryString = atob(data.audio_base64);
          const len = binaryString.length;
          const bytes = new Uint8Array(len);
          for (let i = 0; i < len; i++) {
            bytes[i] = binaryString.charCodeAt(i);
          }
          await playReturnedAudio(bytes.buffer);
        } else {
          showIdleView();
        }
      } catch (err) {
        console.error('Error sending text query:', err);
        showIdleView();
      }
    }

    // Play TTS Audio & Drive Soundwave Visualizer
    async function playReturnedAudio(arrayBuffer) {
      try {
        initAudioContext();
        showActiveView('Speaking...');

        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        if (currentSourceNode) {
          try { currentSourceNode.stop(); } catch(e) {}
        }

        const source = audioCtx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(analyser);
        analyser.connect(audioCtx.destination);

        currentSourceNode = source;
        startVisualizer();

        source.onended = () => {
          showIdleView();
        };

        source.start(0);
      } catch (err) {
        console.error('Audio playback failed:', err);
        showIdleView();
      }
    }

    // Command Palette Modal Logic
    function openModal() {
      cmdKModal.classList.remove('hidden');
      setTimeout(() => {
        modalContent.classList.remove('scale-95', 'opacity-0');
        modalContent.classList.add('scale-100', 'opacity-100');
        textInput.focus();
      }, 10);
    }

    function closeModal() {
      modalContent.classList.remove('scale-100', 'opacity-100');
      modalContent.classList.add('scale-95', 'opacity-0');
      setTimeout(() => {
        cmdKModal.classList.add('hidden');
        textInput.value = '';
      }, 150);
    }

    // Event Listeners Setup
    micBtn.addEventListener('click', () => {
      if (isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    });

    visualizerCapsule.addEventListener('click', () => {
      if (isRecording) {
        stopRecording();
      } else {
        showIdleView();
      }
    });

    // Prompt pills click handlers
    document.querySelectorAll('.prompt-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn === askAnythingPill) {
          openModal();
        } else {
          const prompt = btn.getAttribute('data-prompt');
          sendTextQuery(prompt);
        }
      });
    });

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      // ⌘K or Ctrl+K
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        if (cmdKModal.classList.contains('hidden')) {
          openModal();
        } else {
          closeModal();
        }
        return;
      }

      // Escape key to close modal
      if (e.key === 'Escape' && !cmdKModal.classList.contains('hidden')) {
        closeModal();
        return;
      }

      // Spacebar hold-to-talk (only when modal is hidden and not focused on input)
      if (e.code === 'Space' && !e.repeat) {
        const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
        if (activeTag !== 'input' && activeTag !== 'textarea' && cmdKModal.classList.contains('hidden')) {
          e.preventDefault();
          isSpaceHeld = true;
          startRecording();
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space' && isSpaceHeld) {
        e.preventDefault();
        isSpaceHeld = false;
        stopRecording();
      }
    });

    // Modal submit & background click
    textForm.addEventListener('submit', (e) => {
      e.preventDefault();
      sendTextQuery(textInput.value);
    });

    closeModalBtn.addEventListener('click', closeModal);
    cmdKTrigger.addEventListener('click', openModal);

    cmdKModal.addEventListener('click', (e) => {
      if (e.target === cmdKModal) {
        closeModal();
      }
    });
  </script>
</body>
</html>
