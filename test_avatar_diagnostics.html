<!DOCTYPE html>
<html>
<head>
    <title>Avatar Diagnostics</title>
    <style>
        body { font-family: monospace; background: #1e1e1e; color: #d4d4d4; margin: 0; padding: 10px; }
        .container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; height: 100vh; }
        #avatar-frame { border: 2px solid #4ec9b0; }
        #console-output { border: 2px solid #ce9178; overflow-y: auto; padding: 10px; background: #1e1e1e; }
        .log-line { margin: 2px 0; font-size: 12px; }
        .error { color: #f48771; }
        .warn { color: #dcdcaa; }
        .success { color: #6a9955; }
        .info { color: #569cd6; }
    </style>
</head>
<body>
    <div class="container">
        <iframe id="avatar-frame" src="http://localhost:3000/avatar.html"></iframe>
        <div id="console-output">
            <div class="log-line info">Waiting for iframe to load...</div>
        </div>
    </div>

    <script>
        const outputDiv = document.getElementById('console-output');
        const iframeEl = document.getElementById('avatar-frame');

        // Intercept console of the iframe
        iframeEl.onload = function() {
            console.log('[Host] Avatar iframe loaded');
            const iframeWindow = iframeEl.contentWindow;
            const originalLog = iframeWindow.console.log;
            const originalError = iframeWindow.console.error;
            const originalWarn = iframeWindow.console.warn;

            iframeWindow.console.log = function(...args) {
                originalLog.apply(iframeWindow.console, args);
                const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a)).join(' ');
                addLog(msg, 'info');
            };

            iframeWindow.console.error = function(...args) {
                originalError.apply(iframeWindow.console, args);
                const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a)).join(' ');
                addLog(msg, 'error');
            };

            iframeWindow.console.warn = function(...args) {
                originalWarn.apply(iframeWindow.console, args);
                const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a)).join(' ');
                addLog(msg, 'warn');
            };

            // Also listen for errors
            iframeWindow.addEventListener('error', (e) => {
                addLog(`ERROR: ${e.message} at ${e.filename}:${e.lineno}`, 'error');
            });

            addLog('[Host] Console interception started', 'success');
        };

        function addLog(msg, level = 'info') {
            const line = document.createElement('div');
            line.className = `log-line ${level}`;
            line.textContent = msg;
            outputDiv.appendChild(line);
            outputDiv.scrollTop = outputDiv.scrollHeight;
        }

        window.addEventListener('error', (e) => {
            addLog(`HOST ERROR: ${e.message}`, 'error');
        });

        addLog('[Host] Diagnostics page loaded, waiting for iframe...', 'info');
    </script>
</body>
</html>
